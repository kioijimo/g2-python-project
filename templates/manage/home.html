{% extends "auth_base.html" %}

{% block title %}Manage{% endblock %}

{% block content %}
<div class="flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold">Admin</h1>
    <p class="mt-1 text-sm text-gray-600">Signed in as {{ request.user.email }}</p>
  </div>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button
      type="submit"
      class="rounded border border-gray-400 px-4 py-2 text-sm font-medium hover:bg-gray-100"
    >
      Log out
    </button>
  </form>
</div>

<form method="post" class="mt-6 space-y-4">
  {% csrf_token %} {{ forms.user.as_p }} {{ forms.profile.as_p }}
  <button
    type="submit"
    class="rounded bg-blue-700 px-4 py-2 font-medium text-white hover:bg-blue-800"
  >
    Create account
  </button>
</form>
{% endblock %}

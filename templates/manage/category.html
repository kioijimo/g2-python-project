{% extends "base.html" %}

{% block title %}Category | Campus Equipment System{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="mb-6 flex items-center justify-between border-b border-gray-100 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">Manage Category</h1>
        <p class="mt-1 text-sm text-gray-500">Create and configure equipment categories.</p>
      </div>
      <span class="inline-flex items-center rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">
        Admin Only
      </span>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ forms.catalog_item }}
      <div class="pt-2">
        <button
          type="submit"
          class="inline-flex w-full items-center justify-center rounded-md bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 sm:w-auto"
        >
          Save Category
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

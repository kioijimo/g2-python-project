{% extends "base.html" %}

{% block title %}Category | Campus Equipment System{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-2xl font-bold text-gray-900">Category</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ forms.catalog_item }}
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-md bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
      >
        Submit
      </button>
    </form>
  </div>
</div>
{% endblock %}

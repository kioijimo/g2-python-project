{% extends "base.html" %}

{% block title %}Admin | Campus Equipment System{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-bold text-gray-900">Admin Account Management</h1>
    <form method="post" class="mt-4 space-y-4">
      {% csrf_token %}
      {{ forms.user }}
      {{ forms.profile }}
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-md bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-800"
      >
        Submit
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% load tailwind_tags %}
<!doctype html>
<html lang="en" class="min-h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Campus Equipment System{% endblock %}</title>
    {% tailwind_css %}
  </head>

  <body class="bg-gray-50 font-sans text-gray-900 antialiased">
    <main class="mx-auto {% block container_class %}max-w-md{% endblock %} px-4 py-10 sm:px-6 lg:px-8">
      {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div
          class="rounded-lg border p-3.5 text-sm shadow-sm
          {% if message.tags == 'error' %}
            border-rose-200 bg-rose-50 text-rose-800
          {% elif message.tags == 'success' %}
            border-emerald-200 bg-emerald-50 text-emerald-800
          {% elif message.tags == 'warning' %}
            border-amber-200 bg-amber-50 text-amber-800
          {% else %}
            border-blue-200 bg-blue-50 text-blue-800
          {% endif %}"
          role="alert"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>

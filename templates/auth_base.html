{% load tailwind_tags %}
<!doctype html>
<html lang="en" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Campus Equipment System{% endblock %}</title>
    {% tailwind_css %}
  </head>

  <body class="flex min-h-full flex-col justify-center bg-gray-50 py-12 font-sans text-gray-900 antialiased sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <div class="flex items-center justify-center gap-2">
        <span class="text-xl font-bold tracking-tight text-gray-900">Campus Equipment System</span>
      </div>
    </div>

    <main class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
      {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div
          class="flex items-center gap-2 rounded-lg border p-3 text-sm shadow-sm
          {% if message.tags == 'error' %}
            border-rose-200 bg-rose-50 text-rose-800
          {% elif message.tags == 'success' %}
            border-emerald-200 bg-emerald-50 text-emerald-800
          {% elif message.tags == 'warning' %}
            border-amber-200 bg-amber-50 text-amber-800
          {% else %}
            border-blue-200 bg-blue-50 text-blue-800
          {% endif %}"
          role="alert"
        >
          <span>{{ message }}</span>
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>

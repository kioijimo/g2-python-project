{% extends "base.html" %}

{% block title %}{{ page_title }} | Campus Equipment System{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">{{ page_title }}</h1>
    <p class="mt-2 text-sm text-gray-600">{{ page_description }}</p>

    <div class="mt-6">
      <a
        href="{% url 'portal:home' %}"
        class="inline-flex items-center justify-center rounded-md bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
      >
        Back to dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% extends "auth_base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<h1 class="mb-6 text-3xl font-bold">Sign in</h1>

<form method="post" class="space-y-4">
  {% csrf_token %} {{ form.non_field_errors }}

  <div>
    <label for="{{ form.username.id_for_label }}" class="mb-1 block text-sm font-medium">
      {{ form.username.label }}
    </label>
    {{ form.username }} {{ form.username.errors }}
  </div>

  <div>
    <label for="{{ form.password.id_for_label }}" class="mb-1 block text-sm font-medium">
      {{ form.password.label }}
    </label>
    {{ form.password }} {{ form.password.errors }}
  </div>

  <button
    type="submit"
    class="rounded bg-blue-700 px-4 py-2 font-medium text-white hover:bg-blue-800"
  >
    Sign in
  </button>
</form>

<p class="mt-4 text-sm">
  No account?
  <a href="{% url 'portal:register' %}" class="text-blue-700 underline">Register</a>
</p>
{% endblock %}

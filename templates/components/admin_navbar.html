<header class="border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <!-- Left: Brand -->
    <div class="flex shrink-0 items-center">
      <a
        href="{% url 'manage' %}"
        class="flex items-center gap-2 text-base font-bold text-gray-900 transition hover:text-blue-700"
      >
        <span>Campus Equipment System</span>
      </a>
    </div>

    <!-- Center: Centered Navlinks -->
    <nav class="flex flex-1 flex-wrap items-center justify-center gap-2">
      <!-- 1. Dashboard -->
      <a
        href="{% url 'manage' %}"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
        {% if request.resolver_match.url_name == 'manage' or request.resolver_match.url_name == 'home' %}
          bg-blue-50 text-blue-700 font-semibold
        {% else %}
          text-gray-700 hover:bg-gray-100 hover:text-gray-900
        {% endif %}"
      >
        Dashboard
      </a>

      <!-- 2. Returns Management -->
      <a
        href="{% url 'manage_returns' %}"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
        {% if request.resolver_match.url_name == 'manage_returns' or 'returns' in request.path %}
          bg-blue-50 text-blue-700 font-semibold
        {% else %}
          text-gray-700 hover:bg-gray-100 hover:text-gray-900
        {% endif %}"
      >
        Returns
      </a>

      <!-- 3. Maintenance -->
      <a
        href="{% url 'manage_maintenance' %}"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
        {% if request.resolver_match.url_name == 'manage_maintenance' or 'maintenance' in request.path %}
          bg-blue-50 text-blue-700 font-semibold
        {% else %}
          text-gray-700 hover:bg-gray-100 hover:text-gray-900
        {% endif %}"
      >
        Maintenance
      </a>

      <!-- 4. Sample Page -->
      <a
        href="{% url 'sample' %}"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
        {% if request.resolver_match.url_name == 'sample' %}
          bg-blue-50 text-blue-700 font-semibold
        {% else %}
          text-gray-700 hover:bg-gray-100 hover:text-gray-900
        {% endif %}"
      >
        Sample
      </a>
    </nav>

    <!-- Right: User Profile & Actions -->
    <div class="flex shrink-0 items-center gap-3">
      <div class="hidden text-right sm:block">
        <p class="text-xs text-gray-500">
          Signed in as admin
        </p>
        <p class="text-sm font-medium text-gray-900">
          {{ request.user.email }}
        </p>
      </div>

      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button
          type="submit"
          class="inline-flex items-center rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
        >
          Log out
        </button>
      </form>
    </div>
  </div>
</header>

{% if queryset.paginator.num_pages > 1 %}
<nav
  class="flex flex-wrap items-center justify-between gap-3 border-t border-border-default px-6 py-4"
  aria-label="Pagination"
>
  <p class="text-sm text-text-secondary">
    Page {{ queryset.number }} of {{ queryset.paginator.num_pages }}
  </p>
  <div class="flex items-center gap-2">
    {% if queryset.has_previous %}
    <a
      href="?page={{ page_obj.previous_page_number }}{% if querystring %}&{{ querystring }}{% endif %}"
      class="inline-flex items-center justify-center rounded-md border border-border-default bg-surface-card px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-primary focus:ring-offset-2"
    >
      Previous
    </a>
    {% endif %} {% if queryset.has_next %}
    <a
      href="?page={{ page_obj.next_page_number }}{% if querystring %}&{{ querystring }}{% endif %}"
      class="inline-flex items-center justify-center rounded-md border border-border-default bg-surface-card px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-primary focus:ring-offset-2"
    >
      Next
    </a>
    {% endif %}
  </div>
</nav>
{% endif %}
